[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-clinical-landscape"
version = "0.2.0"
description = "Alzheimer's disease clinical trial competitive landscape using ClinicalTrials.gov API v2"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "requests>=2.32,<3",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
  "streamlit>=1.61,<1.62",
  "pycountry>=24,<25"
]

[project.scripts]
adtrial = "adtrial.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
